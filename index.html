<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#159447">
<link rel="manifest" href="manifest.webmanifest">
<title>Familien Einkaufsliste</title>
<style>
:root{--g:#159447;--gd:#0f7337;--bg:#f5f7f5;--line:#e1e8e2;--muted:#69746c;--warn:#a96000}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#172019}.app{max-width:560px;margin:auto;min-height:100vh;background:#fff}.head{padding:15px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:3}.head h1{font-size:20px;margin:0 0 3px}.muted{color:var(--muted);font-size:13px}main{padding:15px 15px 94px}h2{font-size:20px;margin:8px 0 14px}.card{border:1px solid var(--line);border-radius:18px;padding:14px;margin:0 0 12px;background:#fff}.hero{background:#eef8f0;border-color:#d4ead8}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 13px;font-weight:750}button.primary{background:var(--g);color:#fff}button.primary:active{background:var(--gd)}button.secondary{background:#eef2ef;color:#243027}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{text-align:left;background:#fff;border:1px solid var(--line);padding:15px;min-height:78px}.section{font-weight:850;font-size:14px;margin:18px 0 7px}.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #edf0ed}.item:last-child{border:0}.item input[type=checkbox]{width:22px;height:22px;accent-color:var(--g)}.done .name{text-decoration:line-through;color:#9aa39d}.meta{font-size:11px;color:var(--muted);margin-top:3px}.avatar{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;color:white;font-weight:800;font-size:12px;flex:0 0 auto}.K{background:#159447}.M{background:#d9367a}.C{background:#8c46b5}.P{background:#566573}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);height:72px;padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;z-index:5}.nav{font-size:11px;text-align:center;color:#68736b;min-width:55px}.active{color:var(--g);font-weight:850}.fab{background:var(--g);color:white;border-radius:50%;width:50px;height:50px;font-size:26px;padding:0}.modal{position:fixed;inset:0;background:#0006;z-index:10;display:flex;align-items:flex-end}.sheet{background:#fff;width:100%;max-width:560px;max-height:88vh;overflow:auto;margin:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}.sheet input,.sheet select,.sheet textarea{width:100%;padding:12px;border:1px solid #ccd6ce;border-radius:11px;margin:6px 0 12px;background:#fff}.hidden{display:none!important}.tag{display:inline-block;padding:5px 9px;background:#edf7ef;color:#18733a;border-radius:999px;font-size:12px}.warn{color:var(--warn)}.pill{display:inline-block;background:#f0f4f1;border-radius:999px;padding:7px 10px;margin:3px;font-size:12px}.recipe-icon{font-size:30px;width:38px}.hint{padding:10px 12px;border-radius:12px;background:#f7f9f7;margin:10px 0;font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.small{padding:7px 9px;font-size:12px}.count{font-size:30px;font-weight:850;margin-top:4px}.empty{text-align:center;padding:38px 20px}.empty .big{font-size:46px}.install{background:#eef8f0;border-color:#cfe8d5}.dish-form-row{border:1px dashed #ccd6ce;border-radius:12px;padding:10px;margin:8px 0}.status{font-size:12px;color:var(--muted)}
</style></head>
<body>
<div class="app">
<div class="head"><div class="row"><div><h1>Familien Einkaufsliste</h1><div class="muted" id="who"></div></div><button class="secondary" onclick="userModal()">Person</button></div></div>
<main><section id="start"></section><section id="list" class="hidden"></section><section id="dishes" class="hidden"></section><section id="more" class="hidden"></section></main>
<nav class="bottom"><div class="nav active" id="nav-start" onclick="show('start')">⌂<br>Start</div><div class="nav" id="nav-list" onclick="show('list')">☷<br>Liste</div><button class="fab" onclick="addModal()">+</button><div class="nav" id="nav-dishes" onclick="show('dishes')">🍽<br>Gerichte</div><div class="nav" id="nav-more" onclick="show('more')">☰<br>Mehr</div></nav>
</div><div id="modal" class="modal hidden" onclick="backdropClose(event)"></div>
<script>
const cats=['Obst & Gemüse','Brot & Backwaren','Milchprodukte','Fleisch & Wurst','Nudeln & Reis','Tiefkühl','Getränke','Konserven & Haltbares','Süßigkeiten & Snacks','Hygiene & Körperpflege','Haushalt','Sonstiges'];
const smartRules={
'Milchprodukte':['joghurt','milch','butter','kaese','käse','parmesan','mozzarella','quark','sahne','skyr','frischkaese','frischkäse','margarine','pudding','kefir','mascarpone','feta','creme fraiche'],
'Obst & Gemüse':['apfel','aepfel','äpfel','banane','tomate','gurke','paprika','kartoffel','zwiebel','knoblauch','karotte','moehre','möhre','salat','brokkoli','blumenkohl','zucchini','orange','zitrone','erdbeere','basilikum','avocado','petersilie'],
'Brot & Backwaren':['brot','broetchen','brötchen','toast','baguette','croissant','mehl','backmischung','pizzateig','kuchen','torte'],
'Fleisch & Wurst':['hackfleisch','rind','schwein','hähnchen','haehnchen','pute','wurst','salami','schinken','schnitzel','fleisch'],
'Nudeln & Reis':['spaghetti','nudeln','penne','reis','lasagneplatten','couscous','gnocchi'],
'Tiefkühl':['tk ','tiefkuehl','tiefkühl','fischstäbchen','fischstaebchen','pommes','tk pizza'],
'Getränke':['wasser','saft','cola','limonade','kaffee','tee','kakao','energy'],
'Konserven & Haltbares':['konserve','passierte tomaten','tomatenmark','dose','dosentomaten','oliven','essig','oel','öl','olivenoel','olivenöl','salz','pfeffer','pesto','bruehe','brühe','senf','ketchup'],
'Süßigkeiten & Snacks':['schokolade','chips','kekse','bonbons','gummibaer','gummibär','nuesse','nüsse','popcorn','zucker','muesli','müsli'],
'Hygiene & Körperpflege':['zahnpasta','zahnbuerste','zahnbürste','shampoo','duschgel','deo','seife','rasierer','toilettenpapier','creme','haargel'],
'Haushalt':['waschmittel','spuelmittel','spülmittel','reiniger','schwamm','muellbeutel','müllbeutel','kuechenrolle','küchenrolle','alufolie']};
const defaultPeople=[{name:'Kai',code:'K'},{name:'Marta',code:'M'},{name:'Carla',code:'C'}];
const defaultRecipes=[
{id:'bolo',icon:'🍝',name:'Spaghetti Bolognese',ingredients:[['Spaghetti','500 g'],['Hackfleisch','500 g'],['Passierte Tomaten','2 Packungen'],['Zwiebeln','2 Stück'],['Knoblauch','1 Knolle'],['Tomatenmark','1 Tube'],['Parmesan','1 Stück']]},
{id:'pancake',icon:'🥞',name:'Pfannkuchen',ingredients:[['Mehl','500 g'],['Eier','4 Stück'],['Milch','750 ml'],['Salz','1 Prise'],['Zucker','2 EL']]},
{id:'pizza',icon:'🍕',name:'Pizza Margherita',ingredients:[['Pizzateig','1 Stück'],['Passierte Tomaten','1 Packung'],['Mozzarella','2 Stück'],['Basilikum','1 Bund']]},
{id:'lasagne',icon:'🍲',name:'Lasagne',ingredients:[['Lasagneplatten','1 Packung'],['Hackfleisch','500 g'],['Passierte Tomaten','2 Packungen'],['Zwiebeln','2 Stück'],['Milch','500 ml'],['Mehl','50 g'],['Butter','50 g'],['Käse','200 g']]}
];
const KEY='fel_v4_state', LEARN='fel_learned_categories_v4';
let learned=JSON.parse(localStorage.getItem(LEARN)||'{}');
let deferredPrompt=null;
let state=loadState();
function loadState(){let s;try{s=JSON.parse(localStorage.getItem(KEY)||'null')}catch{};return s&&s.version===4?s:{version:4,user:'Kai',people:defaultPeople,items:[],activities:[],recipes:defaultRecipes,lastCarry:0}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function normalize(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()}
function detect(name){const n=normalize(name);if(!n)return 'Sonstiges';if(learned[n])return learned[n];for(const [cat,terms] of Object.entries(smartRules)){if(terms.some(t=>n.includes(normalize(t))))return cat}return 'Sonstiges'}
function learnCategory(name,cat){const n=normalize(name);if(n){learned[n]=cat;localStorage.setItem(LEARN,JSON.stringify(learned))}}
function pcode(name){return state.people.find(p=>p.name===name)?.code||'P'}
function av(name){let c=pcode(name);return `<span class="avatar ${['K','M','C'].includes(c)?c:'P'}">${esc(c)}</span>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function categoryOptions(selected){return cats.map(c=>`<option ${c===selected?'selected':''}>${esc(c)}</option>`).join('')}
function render(){document.getElementById('who').textContent='Angemeldet als '+state.user;start();list();dishes();more()}
function show(id){['start','list','dishes','more'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));['start','list','dishes','more'].forEach(x=>document.getElementById('nav-'+x).classList.toggle('active',x===id));window.scrollTo({top:0,behavior:'smooth'})}
function openItems(){return state.items.filter(i=>!i.done).length}
function start(){let pending=openItems();document.getElementById('start').innerHTML=`
<div class="card hero"><b>Aktuelle Einkaufsliste</b><div class="count">${state.items.length}</div><div class="muted">${pending} noch offen</div><button class="primary" style="margin-top:12px" onclick="show('list')">Liste öffnen</button></div>
<div class="grid"><button class="tile" onclick="show('dishes')">🍽️<br><b>Wunschgerichte</b><div class="muted">Gericht → Zutaten</div></button><button class="tile" onclick="addModal()">➕<br><b>Artikel hinzufügen</b><div class="muted">automatisch sortiert</div></button><button class="tile" onclick="userModal()">👨‍👩‍👧‍👦<br><b>Familie</b><div class="muted">${state.people.length} Personen</div></button><button class="tile" onclick="activities()">🕘<br><b>Aktivitäten</b><div class="muted">wer hat was ergänzt?</div></button></div>
${deferredPrompt?`<div class="card install"><b>📱 Auf Startbildschirm installieren</b><p class="muted">Danach öffnet sich die Einkaufsliste wie eine normale App.</p><button class="primary" onclick="installApp()">App installieren</button></div>`:''}
<div class="card"><b>Automatische Kategorie-Erkennung</b><p class="muted">Schreibe z. B. <b>Joghurt</b>. Die App erkennt <span class="tag">Milchprodukte</span>. Korrigierst du eine Kategorie, merkt sich die App diese Zuordnung auf diesem Gerät.</p></div>`}
function list(){let h=`<div class="row"><h2>Einkaufsliste</h2><button class="secondary small" onclick="finishShopping()">Einkauf abschließen</button></div>`;for(const c of cats){let a=state.items.filter(i=>i.cat===c);if(!a.length)continue;h+=`<div class="section">${esc(c)}</div><div class="card">`;a.forEach(i=>{let idx=state.items.indexOf(i);h+=`<div class="item ${i.done?'done':''}"><input type="checkbox" ${i.done?'checked':''} onchange="toggle(${idx})"><div style="flex:1"><div class="name"><b>${esc(i.name)}</b> ${i.qty?'<span class="muted">'+esc(i.qty)+'</span>':''}</div><div class="meta">von ${esc(i.by)}${i.fromDish?' · aus '+esc(i.fromDish):''}${i.boughtBy?' · gekauft von '+esc(i.boughtBy):''}</div></div>${av(i.by)}<button class="secondary small" onclick="editItem(${idx})">⋯</button></div>`});h+='</div>'}if(!state.items.length)h+=`<div class="card empty"><div class="big">🛒</div><b>Die Liste ist leer</b><p class="muted">Tippe unten auf + oder füge ein Wunschgericht hinzu.</p><button class="primary" onclick="addModal()">Ersten Artikel hinzufügen</button></div>`;document.getElementById('list').innerHTML=h}
function dishes(){document.getElementById('dishes').innerHTML=`<div class="row"><h2>Wunschgerichte</h2><button class="primary" onclick="newDishModal()">+ Eigenes Gericht</button></div><div class="card"><b>Gerichte</b>${state.recipes.map((r,i)=>`<div class="item"><span class="recipe-icon">${esc(r.icon||'🍽️')}</span><div style="flex:1"><b>${esc(r.name)}</b><div class="meta">${r.ingredients.length} Zutaten</div></div><button class="primary small" onclick="recipe(${i})">Zur Liste</button><button class="secondary small" onclick="editDish(${i})">✎</button></div>`).join('')}</div><div class="hint">Beim Hinzufügen eines Gerichts werden vorhandene Zutaten <b>nicht doppelt angelegt</b>. Die App ergänzt nur fehlende Artikel und merkt sich, von wem das Gericht ausgewählt wurde.</div>`}
function more(){const learnedCount=Object.keys(learned).length;document.getElementById('more').innerHTML=`<h2>Familie & Einstellungen</h2><div class="card">${state.people.map(p=>`<div class="item">${av(p.name)}<div style="flex:1"><b>${esc(p.name)}</b><div class="meta">${p.name===state.user?'Du':'Familienmitglied'}</div></div></div>`).join('')}<button class="secondary" onclick="addPersonModal()">＋ Person hinzufügen</button></div><div class="card"><b>Automatische Kategorien</b><p class="muted">${learnedCount} eigene Zuordnung(en) auf diesem Gerät gespeichert.</p><button class="secondary" onclick="showLearned()">Zuordnungen ansehen</button></div><div class="card"><b>Familien-Synchronisierung</b><p class="muted">Diese Testversion speichert die Liste sicher lokal auf dem jeweiligen Gerät. Für eine echte gemeinsame Liste auf mehreren Handys brauchen wir im nächsten technischen Schritt einen kleinen Online-Speicher/Backend. Die Oberfläche ist dafür bereits vorbereitet.</p><div class="toolbar"><button class="secondary small" onclick="exportData()">Daten sichern</button><button class="secondary small" onclick="importDataModal()">Sicherung einlesen</button></div></div><div class="card"><b>Version 4 – Familien-Test</b><p class="muted">Installierbar, leere Startliste, Kategorien, Gerichte, eigene Gerichte und Übernahme nicht gekaufter Artikel.</p></div>`}
function addModal(){modal(`<h2>Artikel hinzufügen</h2><label>Was wird benötigt?</label><input id="name" placeholder="z. B. Joghurt" oninput="suggestCat()"><div id="suggest" class="muted"></div><label>Menge (optional)</label><input id="qty" placeholder="z. B. 4 Becher"><label>Kategorie</label><select id="cat">${categoryOptions('Sonstiges')}</select><button class="primary" style="width:100%" onclick="add()">Hinzufügen</button>`);setTimeout(()=>document.getElementById('name')?.focus(),100)}
function suggestCat(){let n=document.getElementById('name').value,c=detect(n);document.getElementById('cat').innerHTML=categoryOptions(c);document.getElementById('suggest').innerHTML=n.trim()?c==='Sonstiges'?`<span class="warn">⚠️ Kategorie bitte auswählen.</span>`:`Automatisch erkannt: <span class="tag">${esc(c)}</span>`:''}
function add(){let n=document.getElementById('name').value.trim();if(!n)return;let q=document.getElementById('qty').value.trim(),c=document.getElementById('cat').value;learnCategory(n,c);upsertItem(n,q,c,state.user,null);state.activities.unshift({text:`${state.user} hat ${n} hinzugefügt`,at:Date.now()});save();closeModal();show('list')}
function upsertItem(n,q,c,by,fromDish){let e=state.items.find(i=>normalize(i.name)===normalize(n)&&!i.done);if(e){if(fromDish&&!e.fromDish)e.fromDish=fromDish;return false}state.items.push({name:n,qty:q,cat:c,by,fromDish,done:false,boughtBy:null});return true}
function toggle(i){let item=state.items[i];if(!item)return;item.done=!item.done;item.boughtBy=item.done?state.user:null;state.activities.unshift({text:`${state.user} hat ${item.name} ${item.done?'abgehakt':'wieder geöffnet'}`,at:Date.now()});save()}
function editItem(i){let it=state.items[i];modal(`<h2>Artikel bearbeiten</h2><input id="ename" value="${esc(it.name)}"><input id="eqty" value="${esc(it.qty||'')}" placeholder="Menge"><select id="ecat">${categoryOptions(it.cat)}</select><div class="toolbar"><button class="primary" onclick="saveItem(${i})">Speichern</button><button class="secondary" onclick="deleteItem(${i})">Löschen</button></div>`)}
function saveItem(i){let it=state.items[i];it.name=document.getElementById('ename').value.trim()||it.name;it.qty=document.getElementById('eqty').value.trim();it.cat=document.getElementById('ecat').value;learnCategory(it.name,it.cat);save();closeModal()}
function deleteItem(i){state.items.splice(i,1);save();closeModal()}
function recipe(i){let r=state.recipes[i],added=0;r.ingredients.forEach(([n,q])=>{if(upsertItem(n,q,detect(n),state.user,r.name))added++});state.activities.unshift({text:`${state.user} hat ${r.name} gewählt (${added} neue Zutaten)`,at:Date.now()});save();show('list');toast(`${r.name}: ${added} neue Zutat(en) hinzugefügt.`)}
function newDishModal(){modal(`<h2>Eigenes Gericht erstellen</h2><label>Name</label><input id="dishName" placeholder="z. B. Schnitzel mit Kartoffeln"><label>Symbol</label><input id="dishIcon" value="🍽️"><div id="ingredients"><div class="dish-form-row"><input class="ingName" placeholder="Zutat, z. B. Kartoffeln"><input class="ingQty" placeholder="Menge, z. B. 1 kg"></div></div><button class="secondary" onclick="addIngredientRow()">+ Zutat</button><button class="primary" style="width:100%;margin-top:12px" onclick="saveNewDish()">Gericht speichern</button>`)}
function addIngredientRow(){document.getElementById('ingredients').insertAdjacentHTML('beforeend',`<div class="dish-form-row"><input class="ingName" placeholder="Zutat"><input class="ingQty" placeholder="Menge"></div>`)}
function saveNewDish(){let name=document.getElementById('dishName').value.trim();if(!name)return;let ns=[...document.querySelectorAll('.ingName')],qs=[...document.querySelectorAll('.ingQty')],ings=[];ns.forEach((el,i)=>{let n=el.value.trim();if(n)ings.push([n,qs[i].value.trim()])});if(!ings.length)return;state.recipes.push({id:'custom-'+Date.now(),icon:document.getElementById('dishIcon').value.trim()||'🍽️',name,ingredients:ings});state.activities.unshift({text:`${state.user} hat das Gericht ${name} angelegt`,at:Date.now()});save();closeModal();show('dishes')}
function editDish(i){let r=state.recipes[i];modal(`<h2>${esc(r.name)}</h2>${r.ingredients.map(x=>`<div class="item"><div style="flex:1"><b>${esc(x[0])}</b><div class="meta">${esc(x[1])} · ${esc(detect(x[0]))}</div></div></div>`).join('')}<div class="toolbar"><button class="primary" onclick="recipe(${i});closeModal()">Zutaten zur Liste</button>${r.id.startsWith('custom-')?`<button class="secondary" onclick="deleteDish(${i})">Gericht löschen</button>`:''}</div>`)}
function deleteDish(i){state.recipes.splice(i,1);save();closeModal();show('dishes')}
function finishShopping(){if(!state.items.length)return toast('Die Liste ist leer.');let remaining=state.items.filter(i=>!i.done),bought=state.items.filter(i=>i.done);modal(`<h2>Einkauf abgeschlossen</h2><div class="card hero"><b>${bought.length} gekauft</b><div class="muted">${remaining.length} nicht gekauft</div></div>${remaining.length?`<p>Was soll mit den offenen Artikeln passieren?</p><button class="primary" style="width:100%;margin-bottom:8px" onclick="carryRemaining()">${remaining.length} Artikel in nächste Liste übernehmen</button><button class="secondary" style="width:100%" onclick="discardRemaining()">Nicht übernehmen</button>`:`<button class="primary" style="width:100%" onclick="startFresh()">Neue leere Liste starten</button>`}`)}
function carryRemaining(){let remaining=state.items.filter(i=>!i.done).map(i=>({...i,done:false,boughtBy:null}));state.items=remaining;state.lastCarry=remaining.length;state.activities.unshift({text:`${state.user} hat ${remaining.length} offene Artikel übernommen`,at:Date.now()});save();closeModal();show('list');toast(`${remaining.length} Artikel übernommen.`)}
function discardRemaining(){state.items=[];state.activities.unshift({text:`${state.user} hat eine neue leere Liste gestartet`,at:Date.now()});save();closeModal();show('list')}
function startFresh(){state.items=[];save();closeModal();show('list')}
function userModal(){modal('<h2>Wer bist du?</h2>'+state.people.map(p=>`<button class="tile" style="display:block;width:100%;margin:7px 0;text-align:left" onclick="selectUser('${esc(p.name).replace(/'/g,"\\'")}')">${av(p.name)} &nbsp; <b>${esc(p.name)}</b></button>`).join(''))}
function selectUser(n){state.user=n;save();closeModal()}
function addPersonModal(){modal(`<h2>Person hinzufügen</h2><input id="personName" placeholder="Name"><button class="primary" onclick="addPerson()">Hinzufügen</button>`)}
function addPerson(){let n=document.getElementById('personName').value.trim();if(!n)return;if(state.people.some(p=>normalize(p.name)===normalize(n)))return toast('Person ist bereits vorhanden.');state.people.push({name:n,code:n[0].toUpperCase()});save();closeModal()}
function activities(){modal('<h2>Aktivitäten</h2>'+(state.activities.length?state.activities.slice(0,25).map(a=>`<p>${esc(a.text)}<br><span class="muted">${new Date(a.at).toLocaleString('de-DE')}</span></p>`).join(''):'<p class="muted">Noch keine Aktivitäten.</p>'))}
function showLearned(){let es=Object.entries(learned);modal(`<h2>Gelernte Zuordnungen</h2>${es.length?es.map(([n,c])=>`<div class="item"><div style="flex:1"><b>${esc(n)}</b><div class="meta">${esc(c)}</div></div></div>`).join(''):'<p class="muted">Noch keine eigenen Zuordnungen.</p>'}`)}
function exportData(){let blob=new Blob([JSON.stringify({state,learned},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Familien-Einkaufsliste-Sicherung.json';a.click();URL.revokeObjectURL(a.href)}
function importDataModal(){modal(`<h2>Sicherung einlesen</h2><input type="file" id="backup" accept="application/json"><button class="primary" onclick="importData()">Einlesen</button>`)}
function importData(){let f=document.getElementById('backup').files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(d.state){state=d.state;state.version=4}if(d.learned)learned=d.learned;localStorage.setItem(LEARN,JSON.stringify(learned));save();closeModal();toast('Sicherung eingelesen.')}catch{toast('Datei konnte nicht gelesen werden.')}};r.readAsText(f)}
function modal(x){let m=document.getElementById('modal');m.innerHTML='<div class="sheet"><button style="float:right" class="secondary" onclick="closeModal()">✕</button>'+x+'</div>';m.classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function backdropClose(e){if(e.target.id==='modal')closeModal()}
function toast(t){let d=document.createElement('div');d.textContent=t;d.style='position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#172019;color:#fff;padding:10px 14px;border-radius:12px;z-index:30;max-width:88%;text-align:center;font-size:13px';document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;render()});
async function installApp(){if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;render()}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
render();
</script></body></html>
